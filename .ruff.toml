[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
# Отключаем правила, которые ломают существующий код
ignore = [
    "EXE001",  # Shebang is present but file is not executable
    "UP045",   # Use `X | None` for type annotations (не актуально для Python 3.9)
    "UP037",   # Remove quotes from type annotation
    "UP035",   # Import from `collections.abc` instead: `Mapping`
    "RUF022",  # Use `X | None` for type annotations
    "RUF100",  # Unused `noqa` directive
]

[tool.ruff.lint.isort]
# Настраиваем сортировку импортов
known-first-party = ["dicechess"]
